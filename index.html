<!doctype html>
<html lang="ja" data-theme="dark-blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VRChat Friends &amp; Group Instance Viewer v1.5.4.23</title>
  <link rel="stylesheet" href="index.css">
</head>
<body data-theme="dark-blue" data-instance-display="normal">
  <div class="app-shell">
    <aside id="friendSidebar" class="friend-sidebar" aria-label="フレンド一覧">
      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="friendSidebar mainPane" tabindex="0" aria-label="フレンド一覧の幅を変更" title="フレンド一覧の幅を変更"></div>
      <div class="sidebar-head">
        <span class="sidebar-title">フレンド</span>
        <span id="friendCount" class="sidebar-count" title="表示中 / オンラインフレンド総数" aria-label="表示中 0人 / オンラインフレンド総数 0人">0 / 0</span>
      </div>
      <div class="friend-tools">
        <div class="friend-search-wrap">
          <input id="friendSearch" class="friend-search" type="search" placeholder="フレンドを検索…" autocomplete="off" spellcheck="false" aria-label="フレンドを検索">
          <button id="clearFriendSearch" class="clear-search" type="button" title="検索をクリア" aria-label="検索をクリア">×</button>
        </div>
        <div id="offlineSearchStatus" class="offline-search-status" role="status" aria-live="polite" hidden></div>
        <select id="friendFilter" class="friend-filter" aria-label="フレンドのフィルター">
          <option value="all">すべて</option>
          <option value="favorite" selected>Favorite</option>
          <option value="favorite-group:group_0">Favorite List 1</option>
          <option value="favorite-group:group_1">Favorite List 2</option>
          <option value="favorite-group:group_2">Favorite List 3</option>
          <option value="joinable">Join Friends</option>
        </select>
      </div>
      <div id="friendList" class="friend-list"></div>
      <div class="friend-sidebar-footer">
        <label class="website-toggle" for="showOnWebsite" title="OtherPlatformを表示">
          <input id="showOnWebsite" type="checkbox" aria-label="OtherPlatformを表示" title="OtherPlatformを表示">
          <span class="website-toggle-box" aria-hidden="true"></span>
          <span class="website-toggle-text">OtherPlatform</span>
        </label>
        <label class="website-toggle" for="showOffline" title="Offlineを表示">
          <input id="showOffline" type="checkbox" aria-label="Offlineを表示" title="Offlineを表示">
          <span class="website-toggle-box" aria-hidden="true"></span>
          <span class="website-toggle-text">Offline</span>
        </label>
      </div>
    </aside>

    <button id="sidebarToggle" class="sidebar-toggle" type="button"
            aria-controls="friendSidebar" aria-expanded="true"
            aria-label="今居るインスタンスも表示" title="今居るインスタンスも表示">»</button>

    <main id="mainPane" class="main-pane">
      <section class="toolbar">
        <div class="toolbar-left">
          <div class="tabs" role="tablist" aria-label="表示切替">
            <div class="instance-tab-segment" role="presentation">
              <button class="tab instance-view-tab" data-view="instances" data-filter="all" role="tab" aria-selected="false" title="フレンドがいるすべてのインスタンスを表示">すべて</button>
              <button class="tab instance-view-tab active" data-view="instances" data-filter="favorite_plus" role="tab" aria-selected="true" title="Favoriteフレンドがいるインスタンスを表示">Favorite+</button>
              <button class="tab instance-view-tab" data-view="instances" data-filter="favorite_only" role="tab" aria-selected="false" title="Favoriteフレンドのみ表示">Favorite</button>
              <button class="tab instance-view-tab" data-view="instances" data-filter="groups" role="tab" aria-selected="false" title="Groupインスタンスを表示">Group</button>
            </div>
            <button class="tab friend-view-tab" data-view="friends" role="tab" aria-selected="false" title="フレンドごとに現在の居場所を表示">フレンド</button>
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <select id="sort" class="sort" aria-label="並び順">
            <option value="friends_desc">フレンドが多い順</option>
            <option value="users_desc">参加人数が多い順</option>
          </select>
          <span id="updatedAt" class="updated-at" title="最終更新">更新: --:--:--</span>
        </div>

        <div class="toolbar-options">
          <button id="reloadButton" class="reload-button" type="button" title="最新情報を取得">更新</button>
          <button id="settingsButton" class="settings-button" type="button"
                  aria-label="オプション" aria-expanded="false" aria-controls="settingsPanel"
                  title="オプション"><span class="settings-icon" aria-hidden="true">⚙</span></button>

          <div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-label="オプション">
            <div class="settings-row language-settings">
              <label class="settings-label" for="language">言語 / Language</label>
              <select id="language" class="friend-sort-select" aria-label="Language / 言語"><option value="ja">日本語</option><option value="en">English</option></select>
            </div>
            <div class="settings-row">
              <label class="settings-label" for="friendSort">フレンド表示順</label>
              <select id="friendSort" class="friend-sort-select" aria-label="フレンド表示順">
                <option value="favorite_list" selected>Favorite List順</option>
                <option value="name">名前順</option>
              </select>
            </div>

            <div class="settings-row offline-sort-settings"><label class="settings-label" for="offlineSort">Offline内の並び順</label><select id="offlineSort"><option value="name">名前順</option><option value="recent">最終アクティブが新しい順</option><option value="oldest">最終アクティブが古い順</option></select></div>
            <div class="settings-row">
              <span class="settings-label">表示サイズ</span>
              <div class="instance-size-control" role="group" aria-label="表示サイズ">
                <button class="instance-size-button" type="button" data-instance-size="small" title="表示サイズを小さく">小</button>
                <button class="instance-size-button active" type="button" data-instance-size="medium" title="表示サイズを標準に">中</button>
                <button class="instance-size-button" type="button" data-instance-size="large" title="表示サイズを大きく">大</button>
              </div>
            </div>

            <div class="settings-row">
              <label class="settings-label" for="instanceDisplay">表示形式</label>
              <select id="instanceDisplay" class="instance-display-select" aria-label="表示形式">
                <option value="simple">シンプル</option>
                <option value="normal" selected>ノーマル</option>
              </select>
            </div>

            <div class="settings-row">
              <span class="settings-label">テーマ</span>
              <div class="theme-control" role="radiogroup" aria-label="テーマ">
                <button class="theme-button theme-button-light" type="button"
                        data-theme="light" role="radio" aria-checked="false"
                        aria-label="ライト" title="ライト"></button>
                <button class="theme-button theme-button-ash" type="button"
                        data-theme="ash" role="radio" aria-checked="false"
                        aria-label="アッシュ" title="アッシュ"></button>
                <button class="theme-button theme-button-dark-blue active" type="button"
                        data-theme="dark-blue" role="radio" aria-checked="true"
                        aria-label="ダークブルー" title="ダークブルー"></button>
                <button class="theme-button theme-button-dark" type="button"
                        data-theme="dark" role="radio" aria-checked="false"
                        aria-label="ダーク" title="ダーク"></button>
              </div>
            </div>

            <div class="settings-row">
              <label class="settings-label" for="autoRefresh">自動更新</label>
              <select id="autoRefresh" class="auto-refresh-select" aria-label="自動更新">
                <option value="0">なし</option>
                <option value="5">5分</option>
                <option value="10">10分</option>
                <option value="30">30分</option>
              </select>
            </div>
            <div class="settings-row cache-settings-row">
              <span class="settings-label">保存データ</span>
              <button id="clearCacheButton" class="cache-clear-button" type="button" title="表示設定を残して、全アカウントの取得データを削除し再取得">キャッシュを削除</button>
            </div>
          </div>
        </div>
      </section>

      <section id="statusRow" class="status-row hidden" aria-live="polite">
        <div id="status" class="status"></div>
      </section>

      <section id="login" class="login hidden">
        <p>VRChat公式サイトのログインセッションが必要です。</p>
        <button id="loginButton" class="primary">VRChatにログイン</button>
      </section>

      <section id="list" class="instance-list" aria-label="表示内容"></section>

    </main>
  </div>

  <div id="actionToast" class="action-toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="friendInstancePreview" class="friend-instance-preview hidden" aria-live="polite"></div>
  <div id="favoriteMenu" class="favorite-menu hidden" role="menu" aria-label="Favorite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
